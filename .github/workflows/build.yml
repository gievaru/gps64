name: Build GPS arm64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installing Android NDK (r24)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r24
      - name: Building
        run: ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk NDK_DEBUG=0 -j4
      - name: Uploading the result
        uses: actions/upload-artifact@v4
        with:
          name: GPS64
          path: ./libs/arm64-v8a/libGPS64.so
